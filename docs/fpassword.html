<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sondrop - Sign Up</title>
    <link rel="short-cut icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="fpassword1.html" method="GET">
        <div class="login-screen">
            <div>
                <img src="logo.png" height="300px" width="299px" class="login-logo">
            </div>
            <p>ENTER YOUR EMAIL TO RECEIVE THE RECUPERATION LINK</p>
            <input type="email" class="login-input" placeholder="EMAIL" required>
            <dl>
                <button type="submit" class="sign-1" onclick="window.location.href='index.html'">BACK</button>
                <!-- "onclick" es una propiedad de JS en línea,
                nos permite "saltear" el formulario requerido para redirigirnos a otra página -->
                <button type="submit" class="sign-2">SEND</button>
            </dl>
        </div>
    </form>
</body>
</html>
