    //LINEAS DE JS EN LINEA (IA) PARA EL MP3 PLAYER

    <script>
        const player = new Audio();
        let activeCard = null;

        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', (e) => {
                // Ignora el clic si se presionó un botón o enlace dentro de la tarjeta
                if (e.target.closest('button, a')) return;

                const audioSrc = card.getAttribute('data-audio');
                if (!audioSrc) return;

                // Si se toca la misma tarjeta que ya está sonando, se detiene
                if (activeCard === card && !player.paused) {
                    player.pause();
                    card.classList.remove('playing');
                    activeCard = null;
                    return;
                }

                // Detiene cualquier otra tarjeta que estuviera sonando antes
                if (activeCard) {
                    activeCard.classList.remove('playing');
                }

                player.src = audioSrc;
                player.play();
                card.classList.add('playing');
                activeCard = card;
            });
        });

        // Quita el resaltado cuando el audio termina solo
        player.addEventListener('ended', () => {
            if (activeCard) {
                activeCard.classList.remove('playing');
                activeCard = null;
            }
        });
    </script>
