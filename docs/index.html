<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sondrop - Sign In</title>
    <link rel="short-cut icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="home.html" method="GET">
        <div class="login-screen">
            <div>
                <img src="logo.png" height="300px" width="299px" class="login-logo">
            </div>
            <input type="email" class="login-input" placeholder="EMAIL" required>
            <input type="password" class="login-input" minlength="8" maxlength="16" placeholder="PASSWORD" required>
            <dl>
                <button type="submit" formaction="signup.html" class="sign-1">SIGN UP</button>
                <button type="submit" class="sign-2">SIGN IN</button>
            </dl>
            <a href="fpassword.html" class="link">I forgotten my password</a>
        </div>
    </form>
</body>
</html>
